<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminverwaltung</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#24312a;font:16px Arial;line-height:1.5}header{background:#244b38;color:white;padding:20px}header a{color:white}main{max-width:1050px;margin:auto;padding:20px}section,article{background:white;border:1px solid #dce3de;border-radius:10px;padding:16px;margin:12px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:4px}input,select,button,textarea{font:inherit;padding:9px;border:1px solid #b8c5bc;border-radius:6px;min-width:0}button{background:#244b38;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5}textarea{width:100%}small{color:#68756e}[hidden]{display:none!important}.check{display:flex;align-items:center;gap:8px}article p{white-space:pre-wrap;overflow-wrap:anywhere}</style><header><a href="index.html">← Zurück zur Startseite</a><h1>Terminverwaltung</h1></header><main><p id="status" role="status"></p><section id="login"><h2>Anmeldung</h2><form id="loginform" class="fields"><label>E-Mail<input type="email" name="email" required></label><label>Passwort<input type="password" name="password" required></label><button>Anmelden</button></form></section><div id="protected" hidden><button id="logout">Abmelden</button><button id="new">+ Neuer Termin</button><section id="editor" hidden><h2 id="heading">Neuer Termin</h2><form id="eventform"><div class="fields"><label>Titel *<input name="title" required></label><label>Ortschaft *<select name="location_id" required></select></label><label>Kategorie *<select name="category_id" required></select></label><label>Veranstaltungsort<input name="venue"></label><label>Veranstalter<input name="organizer"></label><label>Beginn *<input type="date" name="start" required></label><label>Ende *<input type="date" name="end" required></label><label id="st">Uhrzeit Beginn<input type="time" name="starttime" value="14:00"></label><label id="et">Uhrzeit Ende<input type="time" name="endtime" value="18:00"></label></div><label class="check"><input type="checkbox" name="all_day">Ganztägig</label><div id="repeatbox" class="fields"><label>Wiederholung<select name="repeat"><option value="">Keine</option><option value="7">Wöchentlich</option><option value="14">Alle zwei Wochen</option><option value="month">Monatlich</option><option value="year">Jährlich</option></select></label><label>Wiederholen bis<input type="date" name="until"></label></div><label>Beschreibung<textarea name="description" rows="4"></textarea></label><label class="check"><input type="checkbox" name="is_public" checked>Öffentlich (auf der Startseite sichtbar)</label><label id="scopebox" hidden>Bearbeitungsumfang<select name="scope"><option value="one">Einzeltermin</option><option value="series">Gesamte Serie (Inhalte, nicht Datum/Uhrzeit)</option></select></label><button type="submit">Speichern</button><button type="button" id="cancel">Abbrechen</button></form></section><section><h2>Terminübersicht</h2><div class="fields"><label>Suche<input id="search"></label><label>Ortschaft<select id="location"></select></label><label>Kategorie<select id="category"></select></label><label>Herkunft<select id="source"><option value="">Alle</option><option value="manual">Manuell</option><option value="import">Kalenderimport</option></select></label><label>Zeitraum<select id="period"><option value="future">Kommende</option><option value="past">Vergangene</option><option value="">Alle</option></select></label></div><div id="results"></div></section><section id="admin" hidden><h2>Administration – Terminrechte</h2><label class="check"><input id="global" type="checkbox">Mitglieder dürfen alle manuell erstellten Termine bearbeiten und löschen</label><button id="saveglobal">Einstellung speichern</button><h3>Änderungsprotokoll</h3><div id="audit"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="termine.js"></script></html>
